name: Pages

# Builds the WebAssembly module for web/ and publishes the directory to GitHub
# Pages. The pages themselves have no build step (see web/README.md); only
# crates/vigil-wasm needs compiling, exactly as web/build.sh does it locally.
#
# One-time setup after this lands: repository Settings → Pages → Build and
# deployment → Source = "GitHub Actions". (Done.)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'crates/vigil-wasm/**'
      - 'crates/vigil-core/**'
      - 'crates/vigil-ledger/**'
      - 'Cargo.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; let an in-progress run finish so a half-built
# site is never published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli
        # Must match the wasm-bindgen version vigil-wasm depends on (Cargo.lock:
        # 0.2.128). A mismatch here produces a module the generated JS cannot
        # bind to. Download the prebuilt binary rather than `cargo install` —
        # compiling the CLI from source costs minutes on every cache miss.
        run: |
          VERSION=0.2.128
          TARBALL=wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -fsSL -o /tmp/wasm-bindgen.tar.gz \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/${VERSION}/${TARBALL}"
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/wasm-bindgen.tar.gz -C "$HOME/.local/bin" --strip-components=1 \
            "wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl/wasm-bindgen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the module into web/pkg/
        run: ./web/build.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
