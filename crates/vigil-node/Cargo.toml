[package]
name = "vigil-node"
description = "The node binary: a single-process, loopback-only HTTP ledger — capture, provenance, and evidence-pack export over one in-memory vigil-ledger Store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "vigil_node"
path = "src/lib.rs"

[[bin]]
name = "vigil-node"
path = "src/main.rs"

[dependencies]
vigil-core.workspace = true
vigil-ledger.workspace = true
ed25519-dalek.workspace = true

# A synchronous, ~4-dependency HTTP/1.1 server. See the rationale in src/main.rs.
tiny_http = "0.12"
serde_json.workspace = true
getrandom = "0.3"
hex.workspace = true
thiserror.workspace = true
anyhow.workspace = true
