[package]
name = "vigil-core"
description = "L0: canonical encoding, hashing, signing, HLC, CRDTs. The shared vocabulary of every other crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blake3.workspace = true
ed25519-dalek.workspace = true
ciborium.workspace = true
serde.workspace = true
rand_core.workspace = true
thiserror.workspace = true
hex.workspace = true

[dev-dependencies]
serde_json.workspace = true

# proptest pulls in wait-timeout, which does not build for wasm32. The golden
# vector tests must run under WASM (architectural invariant #2), so property
# testing is gated to native targets rather than the vector check being given up.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest.workspace = true
